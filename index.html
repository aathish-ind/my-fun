<script>
    // 1. Setup Scene, Camera, and Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. Create the Galaxy Particles
    const particleCount = 15000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
        // Math to create a spiral galaxy shape
        const i3 = i * 3;
        const radius = Math.random() * 5;
        const spinAngle = radius * 2.5; 
        const branchAngle = ((i % 3) * Math.PI * 2) / 3; // 3 spiral arms

        // Add random scatter to make it look like a dust cloud
        const randomX = (Math.random() - 0.5) * 0.5;
        const randomY = (Math.random() - 0.5) * 0.5;
        const randomZ = (Math.random() - 0.5) * 0.5;

        positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;     // x
        positions[i3 + 1] = randomY;                                              // y (flat disc)
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ; // z

        // Make center brighter, outer edges dimmer
        const mixedColor = new THREE.Color().setHSL(0.6, 0.2, 1 - (radius / 5));
        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Material for the particles
    const material = new THREE.PointsMaterial({
        size: 0.02,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true
    });

    const particles = new THREE.Points(geometry, material);
    // Tilt the galaxy so we look at it from an angle
    particles.rotation.x = Math.PI * 0.2; 
    scene.add(particles);

    camera.position.z = 6;

    // 3. Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        // Slowly rotate the entire galaxy
        particles.rotation.z -= 0.002;
        renderer.render(scene, camera);
    }

    animate();

    // 4. Handle Window Resizing
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
